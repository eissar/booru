version: '3'

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'

includes:
  slop:
    taskfile: ./Taskfile_slop.yml
    vars:
      BIN_DIR: '{{.BIN_DIR}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  hooks:install:
    desc: Install the githooks/ scripts into .git/hooks
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - cp githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit

  hooks:check:
    desc: Abort unless the committed githooks are installed in .git/hooks
    silent: true
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - 'echo "githooks are not installed (or are stale); run: task hooks:install" >&2'
      - 'false'

  build:bench:
    desc: Build the benchmark executable
    method: checksum
    sources:
      - bench/*.odin
      - bench/**/*.odin
      - src/*.odin
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - bin/bench
    cmds:
      - mkdir -p bin
      - odin build ./bench -o:speed -out:bin/bench

  test:bench:
    desc: Run the benchmark with systemd memory accounting
    deps: [build:bench]
    cmds:
      - >-
        systemd-run --user --unit=booru-memory-bench
        --collect --pipe --wait --property=MemoryAccounting=yes
        --working-directory="$PWD" -- "$PWD/bin/bench" > bin/bench.json
      - ./bench.pl bin/bench.json

  run:
    desc: 'Build and run the server (pass flags with --, e.g. task run -- -port:9000)'
    deps: [hooks:check]
    cmds:
      - odin run src -- {{.CLI_ARGS}}

  run:harness:
    desc: Run the render harness, dumping every template case to stdout
    deps: [hooks:check]
    cmds:
      - odin run test/html-fixture-tdd/fixture_harness.odin -file {{.CLI_ARGS}}

  preview:
    desc: 'Run the template preview server (pass a port with --, e.g. task preview -- 9000)'
    deps: [hooks:check]
    cmds:
      - odin run test/tools -- {{.CLI_ARGS}}

  check:
    desc: 'Type-check the project packages (pass extra odin flags with --, e.g. task check -- -error-pos-style:unix)'
    deps: [hooks:check]
    vars:
      ODIN_FLAGS: '{{.ODIN_FLAGS | default .CLI_ARGS}}'
    cmds:
      - odin check src {{.ODIN_FLAGS}}

  test:
    desc: 'Run the project''s Odin tests (extra odin flags after --; ODIN_TEST_PKGS=src/cli picks a package)'
    deps: [hooks:check]
    # Set ODIN_TEST_PKGS to narrow the package set (test:all passes it through).
    # It cannot come from -- because -- is odin flags, as in
    # `task test -- -error-pos-style:unix`.
    vars:
      ODIN_TEST_PKGS: '{{.ODIN_TEST_PKGS | default "test"}}'
    cmds:
      - odin test {{.CLI_ARGS}}

  test:render:
    desc: 'Run the Perl HTML fixture tests (requires HTML::Tidy5; pass a name filter with --)'
    deps: [hooks:check]
    cmds:
      - perl test/html-fixture-tdd/fixture_harness_test.pl {{.CLI_ARGS}}

  test:all:
    desc: 'Run project checks and Perl HTML fixture tests'
    deps: [hooks:check]
    cmds:
      - task: test:render
      - task: test:thumbnail
    # deps:
    #   - task: check
    #     vars: {ODIN_FLAGS: '{{.ODIN_FLAGS}}'}
    #   # -- args are odin flags, so keep them away from the non-odin suites.
    #   - task: test:render
    #     vars: {CLI_ARGS: ''}
    #   - task: test:thumbnail

  test:thumbnail:
    desc: 'test src/thumbnail'
    deps: [hooks:check]
    cmds:
      - odin test src/thumbnail/ -debug


  fmt:
    desc: 'Format Odin sources in place (pass a path with --, e.g. task fmt -- src/http)'
    cmds:
      - '"$HOME/.local/share/nvim/mason/bin/odinfmt" -path:{{.CLI_ARGS | default "src"}} -w'

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'
