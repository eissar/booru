version: '3'

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'

includes:
  slop:
    taskfile: ./Taskfile_slop.yml
    vars:
      BIN_DIR: '{{.BIN_DIR}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  hooks:install:
    desc: Install the githooks/ scripts into .git/hooks
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - cp githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit

  hooks:check:
    desc: Abort unless the committed githooks are installed in .git/hooks
    silent: true
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - 'echo "githooks are not installed (or are stale); run: task hooks:install" >&2'
      - 'false'

  build:bench:all:
    desc: Build the optimized benchmark suite
    method: checksum
    sources:
      - src/*.odin
      - src/**/*.odin
      - bench/*.odin
      - bench/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/bench-all'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build bench/ -build-mode:test -o:speed -out:{{.BIN_DIR}}/bench-all -define:ODIN_TEST_THREADS=1

  bench:all:
    desc: Run benchmarks serially (reuse the build when sources are unchanged)
    deps: [hooks:check, build:bench:all]
    cmds:
      - ./{{.BIN_DIR}}/bench-all

  run:
    desc: 'Build and run the server (e.g. task run -- -debug -- -port:9000)'
    deps: [hooks:check]
    cmds:
      - odin run src {{.CLI_ARGS}}

  preview:
    desc: 'Run the template preview server (pass a port with --, e.g. task preview -- 9000)'
    deps: [hooks:check]
    cmds:
      - odin run test/tools -- {{.CLI_ARGS}}

  check:
    desc: 'Type-check the project packages (pass extra odin flags with --, e.g. task check -- -error-pos-style:unix)'
    deps: [hooks:check]
    vars:
      ODIN_FLAGS: '{{.ODIN_FLAGS | default .CLI_ARGS}}'
    cmds:
      - odin check src {{.ODIN_FLAGS}}

  test:
    desc: 'Run the project''s Odin tests (extra odin flags after --; ODIN_TEST_PKGS=src/cli picks a package)'
    deps: [hooks:check]
    cmds:
      - odin test {{.CLI_ARGS}}

  test:render:
    desc: 'Run HTML fixture tests (requires Perl and HTML::Tidy5; extra Odin flags after --)'
    deps: [hooks:check]
    cmds:
      - odin test src/template {{.CLI_ARGS}}

  test:all:build:
    desc: Build the full test suite
    method: checksum
    sources:
      - src/**/*.odin
      - test/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/test-all'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build test/ -build-mode:test -all-packages -debug -out:{{.BIN_DIR}}/test-all -define:ODIN_TEST_LOG_STATE_CHANGES=true

  test:all:
    desc: Run the full test suite (reuse the build when sources are unchanged)
    deps: [hooks:check, test:all:build]
    cmds:
      - set -o pipefail; ./{{.BIN_DIR}}/test-all 2>&1 | grep -v 'changed state to Running'
      # - ./{{.BIN_DIR}}/test-all

  test:thumbnail:
    desc: 'test src/thumbnail'
    deps: [hooks:check]
    cmds:
      - odin test src/thumbnail/ -debug


  fmt:
    desc: 'Format Odin sources in place (pass a path with --, e.g. task fmt -- src/http)'
    cmds:
      - '"$HOME/.local/share/nvim/mason/bin/odinfmt" -path:{{.CLI_ARGS | default "src"}} -w'

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'
