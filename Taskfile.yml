version: '3'

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  # Resolves to the shared hooks dir even in a linked worktree, where .git is a file.
  GIT_HOOKS:
    sh: git rev-parse --git-path hooks

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  hooks:install:
    desc: Install the githooks/ scripts into .git/hooks
    status:
      - cmp -s githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
    cmds:
      - cp githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
      - chmod +x "{{.GIT_HOOKS}}/pre-commit"

  hooks:check:
    desc: Abort unless the committed githooks are installed in .git/hooks
    silent: true
    status:
      - cmp -s githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
    cmds:
      - 'echo "githooks are not installed (or are stale); run: task hooks:install" >&2'
      - 'false'

  assets:install:
    desc: Install pinned frontend build dependencies
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  assets:css:
    desc: Generate the committed Tailwind stylesheet
    deps: [assets:install]
    sources:
      - assets/tailwind.css
      - tailwind.config.js
      - package.json
      - package-lock.json
      - src/template/**/*.odin
      - static/gallery.js
    generates: [static/tailwind.css]
    cmds:
      - npm run build:css

  build:
    desc: Build the optimized server
    deps: [hooks:check, assets:css]
    method: checksum
    sources:
      - src/*.odin
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/booru'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -o:speed -out:{{.BIN_DIR}}/booru

  run:
    desc: 'Build and run the server (e.g. task run -- -debug -- -port:9000)'
    deps: [hooks:check, assets:css]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin run src -out:{{.BIN_DIR}}/booru {{.CLI_ARGS}}

  preview:
    desc: 'Run the template preview server (pass a port with --, e.g. task preview -- 9000)'
    deps: [hooks:check, assets:css]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin run test/tools -out:{{.BIN_DIR}}/preview -- {{.CLI_ARGS}}

  check:
    desc: 'Type-check the project packages (pass extra odin flags with --, e.g. task check -- -error-pos-style:unix)'
    deps: [hooks:check]
    vars:
      ODIN_FLAGS: '{{.ODIN_FLAGS | default .CLI_ARGS}}'
    cmds:
      - odin check src {{.ODIN_FLAGS}}

  test:
    desc: 'Run the project''s Odin tests (extra odin flags after --; ODIN_TEST_PKGS=src/cli picks a package)'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test -out:{{.BIN_DIR}}/test {{.CLI_ARGS}}

  test:render:
    desc: 'Run HTML fixture tests (extra Odin flags after --)'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test src/template -out:{{.BIN_DIR}}/test-render {{.CLI_ARGS}}

  test:all:build:
    desc: Build the full test suite
    method: checksum
    sources:
      - src/**/*.odin
      - test/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/test-all'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build test/ -build-mode:test -all-packages -debug -out:{{.BIN_DIR}}/test-all -define:ODIN_TEST_LOG_STATE_CHANGES=true

  test:all:
    desc: Run the full test suite (reuse the build when sources are unchanged)
    deps: [hooks:check, test:all:build]
    cmds:
      - set -o pipefail; ./{{.BIN_DIR}}/test-all 2>&1 | grep -v 'changed state to Running'
      # - ./{{.BIN_DIR}}/test-all

  test:thumbnail:
    desc: 'test src/thumbnail'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test src/thumbnail/ -out:{{.BIN_DIR}}/test-thumbnail -debug


  fmt:
    desc: 'Format Odin sources in place (pass a path with --, e.g. task fmt -- src/http)'
    cmds:
      - '"$ODINFMT" -path:{{.CLI_ARGS | default "src"}} -w'

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'
