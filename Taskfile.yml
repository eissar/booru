version: '3'

# Every odin invocation pins -out: the toolchain otherwise writes binaries into
# the working directory.

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  SERVER_BIN: '{{.BIN_DIR}}/server'
  EAGLE_IMPORT_BIN: '{{.BIN_DIR}}/eagle-import'
  SLOP_S3_TEST_BIN: '/tmp/s3-slop-tests'
  RENDER_HARNESS_BIN: '/tmp/odin-render-harness'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  build:
    desc: Build the server
    sources:
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.SERVER_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -out:{{.SERVER_BIN}}

  build:debug:
    desc: Build the server with debug assertions and log level Debug
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -debug -out:{{.SERVER_BIN}}

  build:eagle-import:
    desc: Build the Eagle library importer
    sources:
      - src/importers-slop/**/*.odin
    generates:
      - '{{.EAGLE_IMPORT_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src/importers-slop -out:{{.EAGLE_IMPORT_BIN}}

  build:all:
    desc: Build every binary
    deps: [build, build:eagle-import]

  run:
    desc: 'Build and run the server (pass flags with --, e.g. task run -- -port:9000)'
    deps: [build]
    cmds:
      - '{{.SERVER_BIN}} {{.CLI_ARGS}}'

  run:harness:
    desc: Run the render harness, dumping every template case to stdout
    cmds:
      - odin run test/render_harness.odin -file -out:{{.RENDER_HARNESS_BIN}} {{.CLI_ARGS}}

  test:
    desc: Run all tests (Odin unit tests + HTML fixture tests)
    deps: [test:odin, test:s3, test:render]

  test:odin:
    desc: Type-check every package
    cmds:
      - odin check src
      - odin check src/importers-slop
      - odin check src/s3-slop -no-entry-point

  test:s3:
    desc: Run the AWS SigV4 suite (31 cases) with leak checking
    cmds:
      - odin test src/s3-slop/tests -out:{{.SLOP_S3_TEST_BIN}}

  test:render:
    desc: Run the Deno structural HTML fixture tests
    dir: test
    cmds:
      - deno test --allow-run --allow-read --allow-env render_test.ts

  fmt:
    desc: Format all Odin sources in place
    cmds:
      - odin fmt src

  fmt:check:
    desc: Fail if any Odin source is not gofmt-style formatted
    cmds:
      - ./scripts/fmt-check.sh

  vet:
    desc: 'Full pre-commit pass: format check, type check, tests'
    cmds:
      - task: fmt:check
      - task: test

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f {{.SLOP_S3_TEST_BIN}} {{.RENDER_HARNESS_BIN}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'