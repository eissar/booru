version: '3'

# Build tasks pin -out:; odin run removes its executable after running.

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  SERVER_BIN: '{{.BIN_DIR}}/server'
  EAGLE_IMPORT_BIN: '{{.BIN_DIR}}/eagle-import'
  SLOP_S3_TEST_BIN: '/tmp/s3-slop-tests'
  RENDER_HARNESS_BIN: '/tmp/odin-fixture-harness'
  PREVIEW_BIN: '{{.BIN_DIR}}/template-preview'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  hooks:install:
    desc: Install the githooks/ scripts into .git/hooks
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - cp githooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit

  hooks:check:
    desc: Abort unless the committed githooks are installed in .git/hooks
    silent: true
    status:
      - cmp -s githooks/pre-commit .git/hooks/pre-commit
    cmds:
      - 'echo "githooks are not installed (or are stale); run: task hooks:install" >&2'
      - 'false'

  build:
    desc: Build the server
    deps: [hooks:check]
    sources:
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.SERVER_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -out:{{.SERVER_BIN}}

  build:debug:
    desc: Build the server with debug assertions and log level Debug
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -debug -out:{{.SERVER_BIN}}

  build:eagle-import:
    desc: Build the Eagle library importer
    deps: [hooks:check]
    sources:
      - src/importers-slop/**/*.odin
    generates:
      - '{{.EAGLE_IMPORT_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src/importers-slop -out:{{.EAGLE_IMPORT_BIN}}

  build:all:
    desc: Build every binary
    deps: [build, build:eagle-import]

  run:
    desc: 'Build and run the server (pass flags with --, e.g. task run -- -port:9000)'
    deps: [hooks:check]
    cmds:
      - odin run src -- {{.CLI_ARGS}}

  run:harness:
    desc: Run the render harness, dumping every template case to stdout
    deps: [hooks:check]
    cmds:
      - odin run test/html-fixture-tdd/fixture_harness.odin -file -out:{{.RENDER_HARNESS_BIN}} {{.CLI_ARGS}}

  preview:
    desc: 'Build and serve the template preview (pass a port with --, e.g. task preview -- 9000)'
    deps: [build:preview]
    cmds:
      - '{{.PREVIEW_BIN}} {{.CLI_ARGS}}'

  build:preview:
    desc: Build the template preview server into bin/
    deps: [hooks:check]
    sources:
      - test/tools/**/*.odin
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.PREVIEW_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build test/tools -out:{{.PREVIEW_BIN}}

  preview:cases:
    desc: 'Print the preview''s <<<CASE>>> blocks (harness parity; pass fixtures dir with --)'
    deps: [build:preview]
    cmds:
      - '{{.PREVIEW_BIN}} --cases {{.CLI_ARGS}}'

  check:
    desc: 'Type-check every package (pass extra odin flags with --, e.g. task check -- -error-pos-style:unix)'
    deps: [hooks:check]
    vars:
      ODIN_FLAGS: '{{.ODIN_FLAGS | default .CLI_ARGS}}'
    cmds:
      - odin check src {{.ODIN_FLAGS}}
      - odin check src/importers-slop {{.ODIN_FLAGS}}
      - odin check src/s3-slop -no-entry-point {{.ODIN_FLAGS}}

  test:
    desc: 'Run the project''s Odin tests (pass a package or extra odin flags with --)'
    deps: [hooks:check]
    vars:
      # Project test packages only; the slop subdirs have their own targets
      # (test:s3) and are not part of the project's own suite.
      ODIN_TEST_PKGS: '{{.ODIN_TEST_PKGS | default "src"}}'
    cmds:
      - odin test {{.ODIN_TEST_PKGS}} {{.CLI_ARGS}}

  test:s3:
    desc: Run the AWS SigV4 suite (31 cases) with leak checking
    deps: [hooks:check]
    # Keeps the test runner's [INFO] banner out of the way; pass
    # -define:ODIN_TEST_LOG_LEVEL=info with -- when debugging a failure.
    cmds:
      - odin test src/s3-slop/tests -out:{{.SLOP_S3_TEST_BIN}} -define:ODIN_TEST_LOG_LEVEL=error {{.CLI_ARGS}}

  test:render:
    desc: 'Run the Deno structural HTML fixture tests (pass a name filter with --)'
    deps: [hooks:check]
    dir: test/html-fixture-tdd
    # deno has no --no-color flag; NO_COLOR is the supported switch.
    env:
      NO_COLOR: '1'
    cmds:
      - deno test --allow-run --allow-read --allow-env fixture_harness_test.ts {{.CLI_ARGS}}

  test:all:
    desc: 'Run every suite: odin check, odin tests, deno fixtures, and the slop suites'
    deps:
      - task: check
        vars: {ODIN_FLAGS: '{{.ODIN_FLAGS}}'}
      # -- args are odin flags, so keep them away from the non-odin suites.
      - task: test
        vars: {CLI_ARGS: ''}
      - task: test:render
        vars: {CLI_ARGS: ''}
      - task: test:s3
        vars: {CLI_ARGS: ''}

  fmt:
    desc: 'Format Odin sources in place (pass a path with --, e.g. task fmt -- src/http)'
    cmds:
      - '"$HOME/.local/share/nvim/mason/bin/odinfmt" -path:{{.CLI_ARGS | default "src"}} -w'

  vet:
    desc: 'Type check and run every suite; run task fmt first'
    cmds:
      - task: test:all
        vars: {ODIN_FLAGS: '{{.CLI_ARGS}}'}

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f {{.SLOP_S3_TEST_BIN}} {{.RENDER_HARNESS_BIN}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'
