version: '3'

vars:
  BIN_DIR: '{{.BIN_DIR | default "bin"}}'
  # Resolves to the shared hooks dir even in a linked worktree, where .git is a file.
  GIT_HOOKS:
    sh: git rev-parse --git-path hooks

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  hooks:install:
    desc: Install the githooks/ scripts into .git/hooks
    status:
      - cmp -s githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
    cmds:
      - cp githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
      - chmod +x "{{.GIT_HOOKS}}/pre-commit"

  hooks:check:
    desc: Abort unless the committed githooks are installed in .git/hooks
    silent: true
    status:
      - cmp -s githooks/pre-commit "{{.GIT_HOOKS}}/pre-commit"
    cmds:
      - 'echo "githooks are not installed (or are stale); run: task hooks:install" >&2'
      - 'false'

  tailwind:
    desc: Generate the committed Tailwind stylesheet
    sources:
      - tailwind.config.js
      - src/template/**/*.odin
      - static/gallery.js
    generates: [static/tailwind.css]
    cmds:
      - |
        if ! command -v tailwindcss >/dev/null 2>&1; then
          echo "tailwindcss not found; install the standalone Tailwind CSS v3 CLI: https://github.com/tailwindlabs/tailwindcss/releases" >&2
          exit 1
        fi
        printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' | tailwindcss -i - -o static/tailwind.css --minify

  build:
    desc: Build the optimized server
    deps: [hooks:check, tailwind]
    method: checksum
    sources:
      - src/*.odin
      - src/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/booru'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build src -o:speed -out:{{.BIN_DIR}}/booru

  run:
    desc: 'Build and run the server (e.g. task run -- -debug -- -port:9000)'
    deps: [hooks:check, tailwind]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin run src -out:{{.BIN_DIR}}/booru {{.CLI_ARGS}}

  worktree-proxy:
    desc: 'Serve on bin/booru.sock and expose it on a free localhost port (URL printed); Ctrl-C stops both'
    deps: [hooks:check, tailwind]
    cmds:
      - |
        SOCK={{.BIN_DIR}}/booru.sock
        mkdir -p {{.BIN_DIR}}
        odin run src -out:{{.BIN_DIR}}/booru -- -socket:$SOCK -daemon >>{{.BIN_DIR}}/booru.log 2>&1 || exit 1
        trap 'env kill $(lsof -t $SOCK)' EXIT
        socat -d -d TCP-LISTEN:0,bind=localhost,fork,reuseaddr UNIX-CONNECT:$SOCK 2>&1 |
          awk '/listening on/ {n = split($NF, a, ":"); print "http://localhost:" a[n] "/"} / [EF] / {print} {fflush()}'

  check:
    desc: 'Type-check the project packages (pass extra odin flags with --, e.g. task check -- -error-pos-style:unix)'
    deps: [hooks:check]
    vars:
      ODIN_FLAGS: '{{.ODIN_FLAGS | default .CLI_ARGS}}'
    cmds:
      - odin check src {{.ODIN_FLAGS}}

  test:select:
    desc: 'Run selected Odin tests (pass package/flags after --, e.g. task test:select -- src/cli)'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test -out:{{.BIN_DIR}}/test {{.CLI_ARGS}}

  test:render:
    desc: 'Run HTML fixture tests (extra Odin flags after --)'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test src/template -out:{{.BIN_DIR}}/test-render {{.CLI_ARGS}}

  test:cdp:
    desc: 'Run browser CDP tests in test/cdp (extra Odin flags after --)'
    deps: [hooks:check]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin test test/cdp -out:{{.BIN_DIR}}/test-cdp -define:ODIN_TEST_PROGRESS_WIDTH=0 {{.CLI_ARGS}}

  test:all:build:
    desc: Build the full test suite
    method: checksum
    sources:
      - src/**/*.odin
      - test/**/*.odin
      - Taskfile.yml
    generates:
      - '{{.BIN_DIR}}/test-all'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - odin build test/ -build-mode:test -all-packages -debug -out:{{.BIN_DIR}}/test-all -define:ODIN_TEST_PROGRESS_WIDTH=0

  test:all:
    desc: Run the full test suite (reuse the build when sources are unchanged)
    deps: [hooks:check, test:all:build]
    cmds:
      - ./{{.BIN_DIR}}/test-all

  fmt:
    desc: 'Format Odin sources in place (pass a path with --, e.g. task fmt -- src/http)'
    cmds:
      - '"$ODINFMT" -path:{{.CLI_ARGS | default "src"}} -w'

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf tests src/src src.bin
      - 'echo "cleaned"'
